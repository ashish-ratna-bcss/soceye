<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyderabad City Police — OSINT Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f2f6fc;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border: 1px solid #d7e1f0;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(6, 41, 82, 0.1);
        }
        .login-head {
            background: linear-gradient(120deg, #041d39, #062952);
            color: #fff;
            padding: 1rem 1.2rem;
            border-radius: 12px 12px 0 0;
        }
        .login-head h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.2rem; }
        .login-head p  { font-size: 0.82rem; color: #b8cef0; margin: 0; }
        .form-label { font-size: 0.87rem; font-weight: 600; color: #062952; }
        .form-control {
            border: 1px solid #9eb3d2; border-radius: 0.6rem;
            min-height: 44px; font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #2f67b1;
            box-shadow: 0 0 0 0.2rem rgba(47, 103, 177, 0.18);
        }
        .btn-login {
            background: #062952; color: #fff; border: 0;
            border-radius: 0.6rem; min-height: 44px;
            font-weight: 700; font-size: 0.97rem;
            width: 100%; transition: background .15s;
        }
        .btn-login:hover { background: #0f4687; color: #fff; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-head">
                <h1>Hyderabad City Police</h1>
                <p>OSINT Portal &mdash; Authorized Personnel Only</p>
            </div>
            <div class="p-3 p-md-4">
                {% if error %}
                    <div class="alert alert-danger py-2" style="font-size:0.9rem;">{{ error }}</div>
                {% endif %}
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username"
                               class="form-control" autocomplete="username"
                               placeholder="e.g. officer_01" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password"
                                   class="form-control" autocomplete="current-password"
                                   placeholder="Enter your password" required>
                            <button type="button" class="btn btn-outline-secondary" onclick="toggleLoginPw()" tabindex="-1" title="Show/hide password"
                                    style="border-color:#9eb3d2;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-login">Login</button>
                </form>
                <p class="text-muted mt-3 mb-0" style="font-size:0.8rem;">
                    Access is restricted to authorized officers. Contact your administrator if you cannot log in.
                </p>
            </div>
        </div>
    </div>
<script>
function toggleLoginPw() {
    var inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
